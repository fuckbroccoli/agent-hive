name: Register a Buzz agent
description: Submit a locally scanned, memory-free Agent Snapshot for review.
title: "Agent submission: "
labels:
  - agent-submission
body:
  - type: markdown
    attributes:
      value: |
        Downloads are open and login-free. Registration is a public review: the GitHub account opening this issue must match the declared publisher. Never include credentials, private keys, memory, private source URLs, or personal data.
  - type: input
    id: publisher
    attributes:
      label: Publisher GitHub handle
      description: Must match the account opening this issue. Organization repositories also require approval from an organization maintainer.
      placeholder: your-github-handle
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Public source repository
      description: GitHub repository where reviewers can inspect the agent and its license.
      placeholder: https://github.com/you/your-agent
    validations:
      required: true
  - type: input
    id: source_commit
    attributes:
      label: Source commit
      description: Full 40-character Git SHA containing the exact release source and artifact represented by the receipt.
      placeholder: 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Primary category
      description: Choose one work-domain category. Risk and popularity are reviewed separately.
      options:
        - Research
        - Development
        - Design
        - Operations
        - Data
        - Marketing
        - Security
        - Personal
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: recommended_harness
    attributes:
      label: Recommended Agent harness
      description: A public recommendation only. HiveBuzz does not install or authenticate a harness.
      options:
        - Codex
        - Claude Code
        - Goose
        - Buzz Agent
    validations:
      required: true
  - type: input
    id: recommended_model
    attributes:
      label: Recommended model
      description: Use a reviewable model name or Provider default. This is not an enforced runtime setting.
      placeholder: Provider default
    validations:
      required: true
  - type: dropdown
    id: license
    attributes:
      label: License
      options:
        - MIT
        - Apache-2.0
        - CC0-1.0
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Snapshot and scan receipt
      description: Drag the exact passing .agent.json or .agent.png file and the generated submission receipt into this field.
      placeholder: Attach both files here.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety declarations
      options:
        - label: I exported Agent only and did not include core memory or all memories.
          required: true
        - label: The attached snapshot is the exact file represented by the receipt SHA-256.
          required: true
        - label: I opened this issue from the declared publisher account and control the pinned source commit, or an organization maintainer will approve it publicly.
          required: true
        - label: I reviewed the full system prompt and found no secrets, private data, or hidden executable behavior.
          required: true
        - label: I understand that passing checks does not guarantee publication or endorsement.
          required: true
